<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Cleaner</title>
  <meta name="description" content="Car Cleaner – araba temizleme ve oto yıkama oyunu / car wash game">
  <link rel="icon" href="icon.png">
  <style>
    :root { --bg: #0f1b29; --card: #18293c; --text: #eef3f8; --muted: #9fb3c8; --accent: #ffd54f; --link: #4fc3f7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; text-align: center; }
    img.icon { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    h1 { font-size: 40px; margin: 20px 0 4px; letter-spacing: 1px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 6px 0; }
    .links { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn { background: var(--card); color: var(--link); text-decoration: none; padding: 12px 18px; border-radius: 12px; font-weight: 700; }
    footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" alt="Car Cleaner">
    <h1>CAR <span>CLEANER</span></h1>
    <p>Çamuru sil • Lastiği şişir • Tamir et • Kendi oto yıkamanı kur!</p>
    <p>Scrub mud • Pump tires • Fix dents • Build your car wash empire!</p>
    <div class="links">
      <a class="btn" href="privacy.html">Gizlilik Politikası / Privacy Policy</a>
    </div>
    <footer>© 2026 Car Cleaner</footer>
  </main>
</body>
</html>
